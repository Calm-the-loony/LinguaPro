version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - lingua-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: always
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./ssl/conf:/etc/letsencrypt:ro
      - ./ssl/www:/var/www/certbot
    depends_on:
      server:
        condition: service_healthy
    networks:
      - lingua-network

networks:
  lingua-network:
    driver: bridge
