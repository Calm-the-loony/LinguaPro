version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-lingua_secret}
      MYSQL_DATABASE: ${DB_NAME:-tutor_website}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./tutor_website.sql:/docker-entrypoint-initdb.d/tutor_website.sql
    networks:
      - lingua-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-lingua_secret}
      - DB_NAME=${DB_NAME:-tutor_website}
    networks:
      - lingua-network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: always
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./ssl/conf:/etc/letsencrypt:ro
      - ./ssl/www:/var/www/certbot
    depends_on:
      - server
    networks:
      - lingua-network

volumes:
  mysql_data:
